databases:
  - name: ssat-rankings-db
    plan: free
    databaseName: ssat_rankings

services:
  - type: web
    name: ssat-rankings-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m app.cli.ingest_data refresh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ssat-rankings-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
